version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ai_bi_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_bi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai_bi_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: ai_bi_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_bi_db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: ai_bi_celery
    restart: always
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_bi_db
      - REDIS_HOST=redis
    depends_on:
      - redis

volumes:
  postgres_data:
